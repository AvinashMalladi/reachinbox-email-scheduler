# Render Blueprint — single web service running API + BullMQ worker + SPA.
# Deploy: push this repo to GitHub → Render "New +" → "Blueprint" → pick it.
# After first deploy, fill the `sync: false` env vars in the dashboard
# (DATABASE_URL, REDIS_URL, JWT_SECRET, Google/Slack creds + redirect URIs).
services:
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm ci --prefix server && npm --prefix server run build && npm ci --prefix web && npm --prefix web run build
    preDeployCommand: npm --prefix server run migrate
    startCommand: npm --prefix server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_LOGIN
        value: "true"
      - key: ETHEREAL_SENDERS_COUNT
        value: "3"
      - key: ES_ENABLED
        value: "false"
      - key: MIN_DELAY_BETWEEN_SENDS_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "50"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        sync: false